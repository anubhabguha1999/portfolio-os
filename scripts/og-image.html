<!doctype html>
<!-- Source for public/og-image.png (1200×630). Regenerate with: npm run og-image -->
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;color:#f4f2ff;
background:radial-gradient(60% 80% at 85% 20%,rgba(122,104,255,.35),transparent 60%),radial-gradient(50% 60% at 0% 100%,rgba(233,166,255,.18),transparent 60%),#0b0b0f}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:48px 48px}
.left{position:absolute;left:72px;top:64px;width:640px}
.brand{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:650;letter-spacing:-.01em}
h1{margin-top:46px;font-size:64px;line-height:.98;font-weight:700;letter-spacing:-.045em}
h1 em{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-style:italic;letter-spacing:-.02em;background:linear-gradient(100deg,#f4f2ff 5%,#9d8cff 55%,#e9a6ff 95%);-webkit-background-clip:text;color:transparent}
p{margin-top:22px;font-size:25px;line-height:1.35;color:#b9b6c8;max-width:560px}
.chips{display:flex;gap:10px;margin-top:28px}
.chip{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);border-radius:999px;padding:9px 18px;font:600 18px ui-monospace,Menlo,monospace;color:#d9d4ff}
.ok{position:absolute;left:72px;bottom:40px;font-size:19px;color:#8f8ba3;display:flex;gap:10px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:#3ecf8e;box-shadow:0 0 12px #3ecf8e}
.page{position:absolute;background:#fff;border-radius:6px;box-shadow:0 40px 80px -24px rgba(0,0,0,.7);overflow:hidden}
.p1{right:205px;top:120px;width:280px;height:396px;transform:rotate(-7deg)}
.p2{right:40px;top:92px;width:290px;height:410px;transform:rotate(5deg)}
.band{height:96px;background:#2f3a4c;display:flex;align-items:center;gap:14px;padding:0 18px}
.av{width:56px;height:56px;border-radius:50%;border:3px solid #2c7a7b;background:#46536a;color:#fff;font:700 20px sans-serif;display:grid;place-items:center}
.l{height:7px;border-radius:4px;background:#d7dbe2;margin:7px 0}.l.d{background:#2f3a4c}.l.t{background:#2c7a7b;width:42%;height:9px;margin-top:16px}
.cols{display:flex;gap:14px;padding:6px 18px}.cols>div{flex:1}
.chipr{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.chipr span{height:13px;border-radius:3px;background:#2f3a4c;width:34px}
.side{position:absolute;left:0;top:0;bottom:0;width:96px;background:#1f3864}
.gold{height:2px;background:#c9a24b;margin:8px 0}
</style></head><body><div class="grid"></div>
<div class="left">
  <div class="brand"><svg width="44" height="44" viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b3a8ff"/><stop offset="1" stop-color="#6a58f5"/></linearGradient></defs><rect x="1" y="1" width="30" height="30" rx="9" fill="url(#g)"/><path d="M10 22V10h6.2a4.2 4.2 0 0 1 0 8.4H10" fill="none" stroke="#0b0716" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22.5" cy="22" r="2" fill="#0b0716"/></svg>Portfolio OS</div>
  <h1>Build once.<br>Export <em>everywhere.</em></h1>
  <p>Free portfolio website, resume &amp; cover letter builder that runs in your browser.</p>
  <div class="chips"><span class="chip">.html</span><span class="chip">.pdf</span><span class="chip">.docx</span><span class="chip">.zip</span></div>
</div>
<div class="ok"><span class="dot"></span>No sign-up · Nothing uploaded · Works offline</div>
<div class="page p1"><div class="side"></div><div style="margin-left:110px;padding:20px 14px 0 0">
  <div class="l d" style="width:80%;height:16px"></div><div class="l" style="width:60%;background:#999"></div><div class="gold"></div>
  <div class="l t" style="background:#1f3864"></div><div class="l"></div><div class="l"></div><div class="l" style="width:70%"></div>
  <div class="l t" style="background:#1f3864"></div><div class="l"></div><div class="l"></div><div class="l"></div><div class="l" style="width:60%"></div><div class="l"></div><div class="l" style="width:80%"></div></div></div>
<div class="page p2"><div class="band"><div class="av"></div><div style="flex:1"><div class="l" style="background:#fff;width:70%;height:12px"></div><div class="l" style="background:#9aa6b8;width:50%"></div><div class="l" style="background:#5d6a80"></div></div></div>
  <div style="height:22px;background:#dde2ea"></div>
  <div class="cols"><div><div class="l t"></div><div class="l d" style="width:70%"></div><div class="l"></div><div class="l"></div><div class="l"></div><div class="l d" style="width:60%;margin-top:14px"></div><div class="l"></div><div class="l"></div><div class="l t"></div><div class="l"></div><div class="l"></div></div>
  <div><div class="l t"></div><div class="chipr"><span></span><span></span><span style="width:22px"></span><span></span><span></span><span style="width:26px"></span><span></span><span></span></div><div class="l t"></div><div class="l d"></div><div class="l"></div><div class="l"></div><div class="l d" style="margin-top:12px"></div><div class="l"></div><div class="l"></div></div></div></div>
</body></html>
